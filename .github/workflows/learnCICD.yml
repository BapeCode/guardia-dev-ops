name: Glint

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

  # ── Job 1 : Secrets ──────────────────────────

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2 : Semgrep ──────────────────────────────

  semgrep:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >
            .semgrep/airtable.yml
            p/secrets

  # ── Job 3 : Ruff ──────────────────────────────

  ruff:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Permission pour push des corrections
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run Ruff linter
        run: uvx ruff check --fix .

      - name: Run Ruff formatter
        run: uvx ruff format .

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add -A && git commit -m "style: auto-fix ruff" && git push)

  # ── Job 4 : Bandit ──────────────────────────────

  bandit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run Bandit
        run: uvx bandit -r app/ -ll
