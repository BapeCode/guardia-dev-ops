name: Glint

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

  # ── Job 1 : Secrets ──────────────────────────

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2 : Flake8 ──────────────────────────────

  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Flake8
        run: |
          pip install --upgrade pip
          pip install flake8

      - name: Lint avec Flake8
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__,venv
