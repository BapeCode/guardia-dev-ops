<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLINT{% block title %}{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style type="text/tailwindcss">
        @theme {
            --color-background: var(--bg);
            --color-card: var(--bg-card);
            --color-glass: var(--bg-glass);
            --color-border: var(--border);
            --color-border-gold: var(--border-gold);
            --color-text-1: var(--text-1);
            --color-text-2: var(--text-2);
            --color-text-foreground: var(--text-3);
            --color-primary: var(--gold);
            --color-primary-light: var(--gold-light);
            --color-primary-subtitle: var(--gold-subtle);
            --color-destructive: var(--danger);
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body class="h-full">
<main class="bg-background min-h-screen w-full">
    {% block content %}{% endblock %}
</main>
</body>
</html>
