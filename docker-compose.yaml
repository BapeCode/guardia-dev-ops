services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=1
      - FLASK_APP=run.py
      - PYTHONPATH=/app
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - .:/app
      - uploads_data:/app/app/static/uploads
      - db_data:/app/app/instance
    restart: unless-stopped

volumes:
  uploads_data:
  db_data: