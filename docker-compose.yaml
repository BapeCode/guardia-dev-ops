services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
  backend:
    build: .
    image: dshellz/glint:latest
    expose:
      - "5000"
    environment:
      - FLASK_DEBUG=1
      - FLASK_APP=run.py
      - PYTHONPATH=/install/lib/python3.11/site-packages:/app
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - uploads_data:/app/app/static/uploads
      - db_data:/app/app/instance
    restart: unless-stopped

volumes:
  uploads_data:
  db_data: