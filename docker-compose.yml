version: '3.8'

services:
  # --- Base de données MySQL ---
  db:
    image: mysql:8.0
    container_name: guardia-dev-ops
    restart: always
    environment:
      MYSQL_DATABASE: root
      MYSQL_ROOT_PASSWORD: root # À changer plus tard !
      MYSQL_USER: user_guardia
      MYSQL_PASSWORD: user_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # --- API Flask (Backend) ---
  api:
    build: ./backend
    container_name: guardia-dev-ops_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=mysql+pymysql://user_guardia:user_password@db/guardiagram_db
    depends_on:
      - db

# Persistence des données MySQL même si le container s'arrête
volumes:
  db_data: