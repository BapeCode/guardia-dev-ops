# Exemple de Secret pour Kubernetes.
#
# Copier ce fichier en `01-secret.yaml` (NON versionne, present dans .gitignore)
# et remplacer les valeurs par tes vrais secrets encodes en base64.
#
# Pour encoder une valeur en base64 (PowerShell) :
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("ta-valeur-secrete"))
#
# Pour decoder (verification) :
#   [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("dGEtdmFsZXVy"))

apiVersion: v1
kind: Secret
metadata:
  name: glint-secrets
type: Opaque
data:
  SECRET_KEY: Y2hhbmdlLW1lLXNlY3JldC1rZXk=          # "change-me-secret-key" en base64
  JWT_SECRET_KEY: Y2hhbmdlLW1lLWp3dC1rZXk=          # "change-me-jwt-key" en base64
